name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1' # weekly, Monday 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      # Only used when code scanning (GitHub Advanced Security) is enabled, see CODE_SCANNING_ENABLED below.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Build (traced by CodeQL)
        # CodeQL must observe every compiler invocation: no build cache, no configuration cache,
        # no Gradle/Kotlin daemon reuse.
        run: >-
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks
          -Pkotlin.compiler.execution.strategy=in-process
          :core:protocol:compileTestKotlin :core:control:compileTestKotlin :app:compileDebugUnitTestKotlin

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:java-kotlin
          output: sarif-results
          # Code scanning on a private repository needs GitHub Advanced Security. Until the repository
          # variable CODE_SCANNING_ENABLED is set to 'true', results are kept as an artifact and gated below.
          upload: ${{ vars.CODE_SCANNING_ENABLED == 'true' && 'always' || 'never' }}

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif
          path: sarif-results
          if-no-files-found: ignore

      - name: Fail on high/critical findings
        run: python3 .github/scripts/sarif_gate.py sarif-results 7.0
