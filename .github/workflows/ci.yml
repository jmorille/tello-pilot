name: CI

on:
  # Markdown-only changes (README, docs) build nothing. Safe for the Dependabot auto-merge gate, which
  # requires this workflow: a Dependabot PR always touches build files or workflows, never only *.md.
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Only main writes the cache; PRs reuse it read-only.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Test, assemble debug APK, coverage and lint
        # One Gradle invocation: a single configuration phase, and Gradle schedules lint, dexing and the
        # unit tests side by side (org.gradle.parallel) instead of three sequential builds.
        # ANDROID_HOME is preinstalled on GitHub-hosted runners; AGP downloads missing SDK packages.
        # Kover instruments the unit tests: merged line coverage of :core:protocol, :core:control and
        # :app (debug), root reports only (the leading ':' skips the per-module reports, not uploaded).
        # Lint is blocking: lint errors fail the build; its report is uploaded with the test reports.
        run: >-
          ./gradlew --stacktrace
          test :app:assembleDebug :koverXmlReportCoverage :koverHtmlReportCoverage :app:lint

      - name: Coverage badge
        # Also when lint failed after the tests (report present), as before the steps were merged.
        if: ${{ !cancelled() && hashFiles('build/reports/kover/reportCoverage.xml') != '' }}
        # The SVG badge is generated locally because shields.io cannot read a private repository.
        run: |
          python3 .github/scripts/coverage_badge.py build/reports/kover/reportCoverage.xml coverage.svg
          cp coverage.svg build/reports/kover/

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('build/reports/kover/reportCoverage.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: build/reports/kover/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.sarif
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  coverage-badge:
    # Publishes the badge on the orphan `badges` branch (one force-pushed commit, no history), read by
    # README.md. Only for pushes to main: PRs (forks, Dependabot) never get a write token here.
    name: Publish coverage badge
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: true
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: coverage

      - name: Push badge to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          mkdir badges && cd badges
          git init -q -b badges
          cp ../coverage/coverage.svg .
          git add coverage.svg
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Coverage badge for ${SHA}"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
              push -q --force "https://github.com/${REPO}.git" badges:badges
