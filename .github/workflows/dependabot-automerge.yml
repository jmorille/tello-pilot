name: Dependabot auto-merge

# Merges Dependabot patch/minor updates only when the PR is green: every check on the PR head commit
# succeeded (CI and Dependency scan are mandatory), nothing failed, was cancelled or is still pending,
# and the PR head has not moved since (merge pinned with `--match-head-commit`).
#
# Native auto-merge (`gh pr merge --auto`) is NOT used: on a private repository on GitHub Free there is
# no branch protection / ruleset, hence no required status check, and `--auto` would then merge as soon
# as the PR is mergeable, regardless of the checks. The gate below enforces the checks itself.
#
# Flow:
#  - `classify` (pull_request): eligibility from dependabot/fetch-metadata, stored as the `automerge` label.
#  - `merge` runs after `classify` and again each time CI / Dependency scan / CodeQL completes for the
#    PR (workflow_run); whichever event comes last finds every check green and merges.
#
# Optional secret AUTOMERGE_TOKEN (fine-grained PAT: contents, pull-requests, workflows = write) lets
# the merge also handle github-actions updates (GITHUB_TOKEN may not merge workflow-file changes)
# and makes the merge commit trigger CI on main.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: [CI, Dependency scan, CodeQL]
    types: [completed]

permissions: {}

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  classify:
    # Job names start with "automerge-": the gate ignores this workflow's own check runs.
    name: automerge-classify
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    outputs:
      eligible: ${{ steps.eligibility.outputs.eligible }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Label eligibility (patch/minor only)
        id: eligibility
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEPS_JSON: ${{ steps.meta.outputs.updated-dependencies-json }}
        run: |
          echo "update-type: ${UPDATE_TYPE:-unknown}"
          # Eligible when every dependency is a patch/minor update, or uses calendar versioning
          # (e.g. compose-bom 2025.09.00 -> 2026.09.00: a year change is not a major update).
          eligible=$(jq -r '
            def year: (tostring | ltrimstr("v") | split(".")[0] | tonumber? // 0) >= 2000;
            length > 0 and all(.[];
              .updateType == "version-update:semver-patch" or
              .updateType == "version-update:semver-minor" or
              ((.prevVersion | year) and (.newVersion | year)))
          ' <<<"${DEPS_JSON:-[]}")
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          if [[ "$eligible" == "true" ]]; then
            gh pr edit "$PR" --repo "$REPO" --add-label automerge
          else
            gh pr edit "$PR" --repo "$REPO" --remove-label automerge || true
            echo "Not eligible for auto-merge (major or unknown update)."
          fi

  merge:
    name: automerge-merge
    needs: classify
    # always(): on workflow_run, `classify` is skipped and must not skip this job.
    if: >-
      always() && (
        (github.event_name == 'pull_request' &&
         needs.classify.result == 'success' &&
         needs.classify.outputs.eligible == 'true') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.event == 'pull_request' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.actor == 'dependabot[bot]' &&
         startsWith(github.event.workflow_run.head_branch, 'dependabot/'))
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
    env:
      GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
      # Workflows that must have a successful pull_request run on the head commit.
      REQUIRED_WORKFLOWS: .github/workflows/ci.yml .github/workflows/dependencies.yml
      SELF_WORKFLOW: .github/workflows/dependabot-automerge.yml
    steps:
      - name: Merge the PR only if every check is green on its head commit
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [[ -z "$pr" ]]; then echo "No open PR for $BRANCH"; exit 0; fi
          info=$(gh pr view "$pr" --repo "$REPO" --json author,headRefOid,labels,isDraft,baseRefName)
          author=$(jq -r '.author.login' <<<"$info")
          head=$(jq -r '.headRefOid' <<<"$info")
          eligible=$(jq -r '[.labels[].name] | index("automerge") != null' <<<"$info")
          draft=$(jq -r '.isDraft' <<<"$info")
          echo "PR #$pr author=$author head=$head eligible=$eligible draft=$draft"
          if [[ "$author" != "app/dependabot" && "$author" != "dependabot[bot]" ]]; then echo "Not a Dependabot PR"; exit 0; fi
          if [[ "$eligible" != "true" || "$draft" == "true" ]]; then echo "Not eligible (major update or draft)"; exit 0; fi
          if [[ "$head" != "$SHA" ]]; then echo "PR head moved ($SHA -> $head); a newer run will decide"; exit 0; fi

          # 1. Latest pull_request run of every workflow on this commit (this workflow excluded).
          runs=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&event=pull_request&per_page=100" |
            jq --arg self "$SELF_WORKFLOW" \
            '[.workflow_runs[] | select(.path != $self)]
             | group_by(.path) | map(max_by(.created_at))
             | map({path, status, conclusion})')
          echo "Workflow runs: $(jq -c . <<<"$runs")"
          for wf in $REQUIRED_WORKFLOWS; do
            c=$(jq -r --arg p "$wf" '(.[] | select(.path == $p) | "\(.status)/\(.conclusion)") // "missing"' <<<"$runs")
            if [[ "$c" != "completed/success" ]]; then
              echo "Required workflow $wf not green on $SHA ($c); not merging."; exit 0
            fi
          done
          bad_runs=$(jq -r '[.[] | select(.status != "completed" or .conclusion != "success") | "\(.path)=\(.status)/\(.conclusion)"] | join(", ")' <<<"$runs")
          if [[ -n "$bad_runs" ]]; then echo "Workflow runs not green: $bad_runs; not merging."; exit 0; fi

          # 2. Every check run on the commit (all apps), except this workflow's own jobs.
          checks=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.name | startswith("automerge-") | not) | "\(.name)\t\(.status)\t\(.conclusion)"')
          echo "Check runs:"; printf '%s\n' "$checks"
          if [[ -z "$checks" ]]; then echo "No check runs found; not merging."; exit 0; fi
          bad_checks=$(awk -F'\t' '$2 != "completed" || ($3 != "success" && $3 != "skipped")' <<<"$checks")
          if [[ -n "$bad_checks" ]]; then echo "Checks failed, cancelled or pending:"; printf '%s\n' "$bad_checks"; exit 0; fi

          # 3. Legacy commit statuses, if any.
          read -r st_count st_state < <(gh api "repos/$REPO/commits/$SHA/status" --jq '"\(.total_count) \(.state)"')
          if [[ "$st_count" != "0" && "$st_state" != "success" ]]; then
            echo "Commit statuses not green ($st_state); not merging."; exit 0
          fi

          echo "All checks green on $SHA; merging PR #$pr."
          gh pr merge "$pr" --repo "$REPO" --squash --match-head-commit "$SHA"
